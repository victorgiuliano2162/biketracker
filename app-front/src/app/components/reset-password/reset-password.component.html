<div class="auth-container">
  <h2>Nova senha</h2>

  <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <ng-container *ngIf="!success && !errorMessage">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="newPassword">Nova senha</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        <span class="error" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['minlength']">
          A senha deve ter pelo menos 8 caracteres.
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar senha</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        <span class="error" *ngIf="form.touched && form.errors?.['mismatch']">
          As senhas não coincidem.
        </span>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Salvando...' : 'Redefinir senha' }}
      </button>
    </form>
  </ng-container>

  <ng-container *ngIf="success">
    <p>Senha redefinida com sucesso! Você será redirecionado ao login...</p>
  </ng-container>

  <a routerLink="/login">Voltar ao login</a>
</div>

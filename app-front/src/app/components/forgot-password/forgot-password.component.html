<mat-card>
<div class="auth-container">
  <h2>Recuperar senha</h2>


    <ng-container *ngIf="!submitted; else successMessage" class="login-card">
      <p>Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>
      
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          autocomplete="email"
        />
        <span class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Informe um e-mail válido.
        </span>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar link de recuperação' }}
      </button>
    </form>
    
    <a routerLink="/login">Voltar ao login</a>
  </ng-container>
  
  <ng-template #successMessage>
    <p>
      Se este e-mail estiver cadastrado, você receberá um link de recuperação em breve.
      Verifique sua caixa de entrada e a pasta de spam.
    </p>
    <a routerLink="/login">Voltar ao login</a>
  </ng-template>
</div>
</mat-card>

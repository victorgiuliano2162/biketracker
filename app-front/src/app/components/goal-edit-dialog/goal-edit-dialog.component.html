<div class="dialog-wrap">
  <div class="dialog-header">
    <div>
      <span class="header-kicker font-mono-tabular">METAS // EDIÇÃO</span>
      <h2 mat-dialog-title class="header-title">Editar meta</h2>
    </div>
    <button mat-icon-button (click)="cancel()" class="close-btn" aria-label="Fechar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-body">
    <form [formGroup]="form" class="form-grid">
      <div class="field-group span-2">
        <label class="field-label" for="edit-goal-name">Nome</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <input id="edit-goal-name" matInput formControlName="name" />
          @if (form.get('name')?.invalid && form.get('name')?.touched) {
            <mat-error>Nome é obrigatório</mat-error>
          }
        </mat-form-field>
      </div>

      <div class="field-group span-2">
        <label class="field-label" for="edit-goal-desc">Descrição</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <textarea
            id="edit-goal-desc"
            matInput
            formControlName="description"
            rows="2"
            cdkTextareaAutosize
          ></textarea>
        </mat-form-field>
      </div>

      <div class="field-group">
        <label class="field-label" for="edit-goal-target">Valor alvo</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <input id="edit-goal-target" matInput type="number" inputmode="decimal" formControlName="targetValue" min="0.1" />
          @if (form.get('targetValue')?.invalid && form.get('targetValue')?.touched) {
            <mat-error>Valor inválido</mat-error>
          }
        </mat-form-field>
      </div>

      <div class="field-group">
        <label class="field-label">Unidade</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <mat-select formControlName="unit">
            @for (u of units; track u.value) {
              <mat-option [value]="u.value">{{ u.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-group span-2">
        <label class="field-label" for="edit-goal-deadline">Prazo</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <input
            id="edit-goal-deadline"
            matInput
            [matDatepicker]="picker"
            formControlName="deadLine"
            placeholder="dd/mm/aaaa"
            [min]="today"
          />
          <mat-datepicker-toggle matIconSuffix [for]="picker" />
          <mat-datepicker #picker />
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button (click)="cancel()">Cancelar</button>
    <button
      mat-flat-button
      color="primary"
      class="save-btn"
      [disabled]="form.invalid"
      (click)="confirm()"
    >
      <mat-icon>save</mat-icon>
      <span>Salvar alterações</span>
    </button>
  </mat-dialog-actions>
</div>

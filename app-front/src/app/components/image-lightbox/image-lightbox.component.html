<div class="lightbox-wrap">
  <button mat-icon-button class="lb-close" (click)="close()" aria-label="Fechar">
    <mat-icon>close</mat-icon>
  </button>

  @if (data.urls.length > 1) {
    <button
      mat-icon-button
      class="lb-nav lb-prev"
      (click)="prev()"
      [disabled]="current === 0"
      aria-label="Foto anterior"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>
  }

  <div class="lb-image-wrap">
    <img [src]="data.urls[current]" class="lb-image" alt="Foto da rota" />
  </div>

  @if (data.urls.length > 1) {
    <button
      mat-icon-button
      class="lb-nav lb-next"
      (click)="next()"
      [disabled]="current === data.urls.length - 1"
      aria-label="Próxima foto"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>

    <div class="lb-counter font-mono-tabular">{{ current + 1 }} / {{ data.urls.length }}</div>
  }
</div>

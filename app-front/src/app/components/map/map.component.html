<div class="map-page">
  <div class="map-container">
    <div id="leaflet-map"></div>
  </div>

  <!-- Botão toggle de camadas -->
  <button
    mat-mini-fab
    class="hud-fab sidebar-toggle"
    (click)="sidebarOpen = !sidebarOpen"
    [matTooltip]="sidebarOpen ? 'Fechar painel' : 'Camadas GPX'"
    aria-label="Alternar painel de camadas"
  >
    <mat-icon>{{ sidebarOpen ? 'close' : 'layers' }}</mat-icon>
  </button>

  <!-- Controles flutuantes Frosted HUD -->
  <div class="map-controls">
    <button
      mat-mini-fab
      class="hud-fab hud-fab--primary"
      matTooltip="Minha localização"
      (click)="centerOnUser()"
      [disabled]="locating"
      aria-label="Minha localização"
    >
      <mat-icon>{{ locating ? 'pending' : 'my_location' }}</mat-icon>
    </button>

    <div class="controls-divider"></div>

    <button
      mat-mini-fab
      class="hud-fab"
      matTooltip="Carregar arquivo(s) GPX"
      (click)="openGpxPicker()"
      aria-label="Carregar arquivo GPX"
    >
      <mat-icon>upload_file</mat-icon>
    </button>

    @if (hasGpx) {
      <button
        mat-mini-fab
        class="hud-fab hud-fab--primary"
        matTooltip="Salvar rota ativa"
        [disabled]="!gpxStats || savingRouteId !== null"
        (click)="saveActiveRoute()"
        aria-label="Salvar rota ativa"
      >
        @if (savingRouteId !== null) {
          <mat-spinner diameter="20" />
        } @else {
          <mat-icon>cloud_upload</mat-icon>
        }
      </button>

      <button
        mat-mini-fab
        class="hud-fab hud-fab--danger"
        matTooltip="Limpar tudo"
        (click)="clearAll()"
        aria-label="Limpar tudo"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
    }
  </div>

  <!-- Painel de elevação -->
  @if (gpxStats) {
    <app-elevation-panel
      [stats]="gpxStats"
      [color]="getActiveColor()"
      (cursorMove)="onCursorMove($event)"
    />
  }

  <!-- Input oculto — múltiplos arquivos -->
  <input
    #gpxInput
    type="file"
    accept=".gpx"
    multiple
    style="display: none"
    (change)="onGpxFileSelected($event)"
  />

  <!-- Painel lateral de camadas GPX -->
  <app-map-sidebar
    [open]="sidebarOpen"
    [treeData]="treeData"
    [selectedIds]="selectedRouteIds"
    [savingRouteId]="savingRouteId"
    [isEmpty]="isTreeEmpty"
    (toggleRoute)="toggleRoute($event)"
    (saveRoute)="saveRoute($event)"
    (deleteRoute)="deleteRoute($event)"
    (clearAll)="clearAll()"
  />
</div>

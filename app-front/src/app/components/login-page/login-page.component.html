<app-auth-shell
  [showTopoSvg]="true"
  badgeLabel="HARD"
  badgeVariant="hard"
  segmentTitle="Serra do Japi — Loop Norte"
  segmentMeta="Jundiaí, BR · Marina Costa"
  distance="48,4"
  elevation="+865"
>
  <h1 class="auth-heading">Entrar na sua conta</h1>
  <p class="auth-subheading">
    Acesse suas rotas GPX, mapas altimétricos e metas de treino.
  </p>

  <form (ngSubmit)="onLogin()" class="auth-form">
    <div class="field-group">
      <label class="field-label" for="login-email">E-mail</label>
      <input
        id="login-email"
        class="field-input"
        autocomplete="username"
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="atleta@exemplo.com.br"
        required
      />
    </div>

    <div class="field-group">
      <div class="field-label-row">
        <label class="field-label" for="login-password">Senha</label>
        <a class="forgot-link" routerLink="/forgot-password">Esqueci minha senha</a>
      </div>

      <div class="password-wrap">
        <input
          id="login-password"
          class="field-input field-input--password"
          autocomplete="current-password"
          [type]="hidePassword ? 'password' : 'text'"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••••••"
          required
        />
        <button
          type="button"
          class="toggle-pw-btn"
          (click)="hidePassword = !hidePassword"
          aria-label="Alternar visibilidade da senha"
        >
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="submit-btn"
      [disabled]="!isValid()"
    >
      Entrar
    </button>
  </form>

  <div class="auth-divider">
    <span>Novo no Tracker?</span>
    <button
      mat-stroked-button
      type="button"
      class="register-btn"
      (click)="onRegister()"
      routerLink="/subscribe"
    >
      Criar conta gratuitamente
    </button>
  </div>
</app-auth-shell>

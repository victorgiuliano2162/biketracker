<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <a class="brand-lockup" routerLink="login">
        <span class="brand-badge">
          <mat-icon>directions_bike</mat-icon>
        </span>
        <span class="brand-name">Tracker</span>
      </a>

      @if (authService.isAuthenticated()) {
        <nav class="desktop-nav" aria-label="Navegação principal">
          <a class="nav-link" routerLink="login">Home</a>

          <button type="button" class="nav-link nav-dropdown" [matMenuTriggerFor]="menuMapas">
            <span>Mapas</span>
            <mat-icon>expand_more</mat-icon>
          </button>
          <mat-menu #menuMapas="matMenu">
            <button mat-menu-item routerLink="map">
              <mat-icon>add_location_alt</mat-icon>
              <span>Visualizar rota</span>
            </button>
            <button mat-menu-item routerLink="routes">
              <mat-icon>map</mat-icon>
              <span>Minhas Rotas</span>
            </button>
          </mat-menu>

          <button type="button" class="nav-link nav-dropdown" [matMenuTriggerFor]="menuMetas">
            <span>Status</span>
            <mat-icon>expand_more</mat-icon>
          </button>
          <mat-menu #menuMetas="matMenu">
            <button mat-menu-item routerLink="goal">
              <mat-icon>flag</mat-icon>
              <span>Criar metas</span>
            </button>
            <button mat-menu-item routerLink="goals">
              <mat-icon>checklist</mat-icon>
              <span>Minhas metas</span>
            </button>
            <button mat-menu-item routerLink="status">
              <mat-icon>leaderboard</mat-icon>
              <span>Estatísticas</span>
            </button>
          </mat-menu>
        </nav>
      }
    </div>

    <div class="topbar-right">
      @if (!authService.isAuthenticated()) {
        <a mat-flat-button color="primary" class="btn-signup" routerLink="/subscribe">
          Inscrever-se gratuitamente
        </a>
      } @else {
        <div class="desktop-user-actions">
          <button type="button" class="user-btn-ghost" (click)="onPerfil()">
            <mat-icon>person_outline</mat-icon>
            <span>Perfil</span>
          </button>
          <button type="button" class="user-btn-outline" (click)="onLogout()">
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </div>

        <button
          type="button"
          class="mobile-menu-btn"
          [matMenuTriggerFor]="mobileMenu"
          aria-label="Abrir menu de navegação"
        >
          <mat-icon>menu</mat-icon>
          <span>Menu</span>
        </button>

        <mat-menu #mobileMenu="matMenu">
          <button mat-menu-item routerLink="login">
            <mat-icon>home</mat-icon>
            <span>Home</span>
          </button>
          <button mat-menu-item routerLink="map">
            <mat-icon>add_location_alt</mat-icon>
            <span>Estúdio GPX</span>
          </button>
          <button mat-menu-item routerLink="routes">
            <mat-icon>map</mat-icon>
            <span>Minhas Rotas</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item routerLink="goals">
            <mat-icon>checklist</mat-icon>
            <span>Minhas metas</span>
          </button>
          <button mat-menu-item routerLink="goal">
            <mat-icon>flag</mat-icon>
            <span>Criar metas</span>
          </button>
          <button mat-menu-item routerLink="status">
            <mat-icon>leaderboard</mat-icon>
            <span>Estatísticas</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onPerfil()">
            <mat-icon>person_outline</mat-icon>
            <span>Perfil</span>
          </button>
          <button mat-menu-item (click)="onLogout()">
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      }
    </div>
  </div>
</header>

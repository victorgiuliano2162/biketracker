<div class="dialog-container">
  <div class="success-badge">
    <mat-icon class="success-icon">check_circle</mat-icon>
  </div>
  <h2 mat-dialog-title class="dialog-title">Cadastro realizado!</h2>
  <mat-dialog-content class="dialog-body">
    <p>Sua conta foi criada com sucesso.<br>Você será redirecionado para a página de login.</p>
  </mat-dialog-content>
  <mat-dialog-actions class="dialog-actions">
    <button mat-flat-button color="primary" class="confirm-btn" (click)="close()">OK</button>
  </mat-dialog-actions>
</div>

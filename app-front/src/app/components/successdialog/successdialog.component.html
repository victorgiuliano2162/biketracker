<div class="dialog-container">
      <mat-icon class="success-icon">check_circle</mat-icon>
      <h2 mat-dialog-title>Cadastro realizado!</h2>
      <mat-dialog-content>
        <p>Sua conta foi criada com sucesso.<br>Você será redirecionado para a página de login.</p>
      </mat-dialog-content>
      <mat-dialog-actions>
        <button mat-flat-button (click)="close()">OK</button>
      </mat-dialog-actions>
    </div>

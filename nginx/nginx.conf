events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  client_max_body_size 10M;

  # Redireciona todo tráfego HTTP para HTTPS
  server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
  }

  # Servidor HTTPS principal
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # MinIO — presigned URLs geradas com host interno "minio:9000"
    # O backend deve gerar as URLs com host "localhost/minio" (ou este proxy reescreve o host)
    location /minio/ {
      proxy_pass         http://minio:9000/;
      proxy_http_version 1.1;
      proxy_set_header   Host              minio:9000;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

      # Presigned URLs já carregam a assinatura — não adicionar headers extras de auth
      proxy_set_header   Authorization     "";
    }

    # Frontend Angular
    location / {
      proxy_pass         http://front:80;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_intercept_errors on;
      error_page 404 = /index.html;
    }

    # Backend Spring Boot
    location /api/ {
      proxy_pass         http://app:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}